# Runs the test suite and a build on every push to a branch and every pull request.
# Not on main: deploy.yml already runs npm ci, npm test and npm run build there before
# it publishes, so a second run on the same commit could never catch anything (DGS 2026-09-20).
name: test
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # node --test runs the TypeScript tests natively
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
