# Runs the test suite and a build on every push and pull request.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # node --test runs the TypeScript tests natively
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
