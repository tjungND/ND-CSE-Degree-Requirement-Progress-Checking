# Weekly snapshot of the published Google Sheet into data/snapshot.json, so the
# app keeps working even if the sheet is unpublished. Also runnable by hand:
# repo → Actions → sync-sheet → Run workflow.
name: sync-sheet
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sync-sheet
      - run: npm test
      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "sheet-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Weekly rules-sheet snapshot ($(date -u +%F))"
          git push
