# Snapshot of the published Google Sheet into data/snapshot.json, every 6 hours:
# the app keeps working if the sheet is ever unpublished, and the pages can say
# when the rules last changed — scripts/sync-sheet.ts leaves the file untouched
# while the sheet's content is unchanged, so each commit here marks a real edit
# (see src/data/rules-date.ts). When the snapshot changes it is committed and the
# deploy workflow is started. Also runnable by hand: repo → Actions → sync-sheet
# → Run workflow. Note: GitHub pauses scheduled workflows in a public repository
# after 60 days without repository activity and emails the owner — re-enable it
# from the Actions tab (MAINTENANCE.md, "Sync, deploy, test").
name: sync-sheet
on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to start the deploy workflow after a snapshot commit
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reachability check (diagnostic only — shows whether Google answers the runner)
        run: |
          for tab in courses parameters categories; do
            url=$(node -p "require('./data/sheet-urls.json').$tab")
            curl -sS -o /dev/null --max-time 60 -w "$tab: HTTP %{http_code}, %{size_download} bytes in %{time_total} s\n" "$url" || echo "$tab: curl failed"
          done
      - run: npm run sync-sheet
      - run: npm test
      - name: Commit the snapshot if it changed, then redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "Snapshot unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "sheet-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Rules-sheet snapshot: the sheet's content changed ($(date -u +%F))"
          git push
          # A push made with GITHUB_TOKEN never triggers the deploy workflow's
          # `on: push` (GitHub's guard against workflow loops). Starting it by
          # workflow_dispatch is the documented exception, so the deployed
          # fallback copy and the "last updated" date refresh without a human push.
          gh workflow run deploy.yml --ref main
