<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light and dark since 2026-10-04 (night mode; data-theme on <html>). -->
    <meta name="color-scheme" content="light dark" />
    <!-- No icon file: without this line every browser asks the server for
         /favicon.ico, gets a 404 and Chrome logs it as a console error
         (cross-browser review, 2026-10-10). -->
    <link rel="icon" href="data:," />
    <!-- Night mode before the first paint (DGS 2026-10-04; src/ui/theme.ts has the
         rest and must agree): a saved Light/Dark wins; otherwise the device's
         setting, except embedded (?embed=1), where Auto stays light. -->
    <script>
      try {
        var p = localStorage.getItem('cse-degree-audit/v1/theme');
        var e = new URLSearchParams(location.search).get('embed') === '1' || location.hash === '#embed';
        var d = p === 'dark' || (p !== 'light' && !e && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      } catch (x) {}
    </script>
    <title>CSE Graduate Course Rules — which courses count</title>
    <meta
      name="description"
      content="Which Notre Dame CSE graduate courses count toward the MSCSE and Ph.D. degrees, which core-knowledge area and specialization category each satisfies, and when they are typically offered. Generated live from the DGS's rules sheet."
    />
  </head>
  <body>
    <div id="app">
      <!-- The whole page is built in the browser, so without JavaScript this
           file is an empty box: no heading, no contact, nothing to say why
           (review R-25, 2026-09-18). The renderer clears #app before it draws,
           so this costs the working page nothing. Plain HTML on purpose — it
           has to read correctly with no stylesheet either. -->
      <noscript>
        <h1>CSE Graduate Course Rules</h1>
        <p>
          <strong>This page needs JavaScript.</strong> The course list is built in your own browser from the Director of Graduate Studies' rules
          spreadsheet — nothing about you is sent anywhere — so with scripts turned off there is nothing to show.
        </p>
        <p>
          Turn JavaScript on for this site and reload, or ask for the current course rules directly:
          <a href="mailto:tjung@nd.edu">tjung@nd.edu</a> (Prof. Taeho Jung, Director of Graduate Studies).
        </p>
        <p>
          The requirements themselves are in the
          <a href="https://drive.google.com/open?id=1SpxGErmfwWvU4dTEkAy_3LJvzm_DUxA_&amp;usp=drive_fs">CSE Graduate Studies Handbook</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="./src/courses.ts"></script>
  </body>
</html>
